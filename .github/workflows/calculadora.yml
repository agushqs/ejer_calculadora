name: Calculadora java

on: [ push ]

jobs:
  calculadora-test:
    runs-on: ubuntu-latest
    steps:
    
      - name: descargar datos
        uses: actions/checkout@v5
        
      - name: configuramos java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          
      - name: compilar y guardar
        run: |
          mkdir -p out
          javac -d out src/*.java   
      
      - name: ejecutar tests
        run: java -ea -cp out CalculadoraTest
        