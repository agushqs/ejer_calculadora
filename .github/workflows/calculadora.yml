name: Calculadora java

on: [ push ]

jobs:
  test-calculadora:
    runs-on: ubuntu-latest
    steps:
      - name: extraer datos
        uses: actions/checkout@v5
      
      - name: configuracion de java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      
      - name: compilar codigo y guardarlo
        run: |
          mkdir -p out
          javac -d out src/*.java
          
      - name: ejecutar tests
        run: java -ea -cp out CalculadoraTest
        
      - name: crear JAR ejecutable
        run: jar --create --file calculadora.jar --main-class Main -C out .
        
      - name: probar JAR
        run: java -jar calculadora.jar