name: calculadora java

on: [ push ]

jobs:
  test-calculadora-java:
    runs-on: ubuntu-latest
    steps:
      - name: bajar datos
        uses: actions/checkout@v5
        
      - name: configurar java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
        
      - name: compilar y guardar codigo
        run: |
          mkdir -p out
          javac -d out src/*.java
        
      - name: ejecutar tests
        run: java -ea -cp out CalculadoraTest
        
      - name: crear JAR ejecutable
        run: jar --create --file calculadora.jar --main-class Main -C out .
        
      - name: ejecutar JAR
        run: java -jar calculadora.jar
        
      - name: subir artefacto a GH
        uses: actions/upload-artifact@v5
        with:
          name: calculadora-tests
          path: calculadora.jar